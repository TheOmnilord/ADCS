name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table Severity, RuleName, ScriptName, Line -AutoSize | Out-String -Width 200 | Write-Host
            throw "$(@($results).Count) PSScriptAnalyzer finding(s) - see above."
          }
          Write-Host 'PSScriptAnalyzer: clean.'

  test:
    name: Pester (${{ matrix.engine }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1, pwsh = PowerShell 7 - the script supports both,
        # and encoding/typing semantics differ between them, so the safe tiers run under each.
        engine: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      # The Guard tier invokes the script, which does Import-Module ActiveDirectory up front.
      # Its validation throws fire BEFORE any domain controller is contacted, so the module is
      # required but no domain/DC is - the RSAT feature on the Server-based runner suffices.
      - name: Install RSAT ActiveDirectory module
        shell: pwsh
        run: Install-WindowsFeature RSAT-AD-PowerShell | Out-Null

      - name: Install Pester 5+
        shell: ${{ matrix.engine }}
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 6) {
            # Windows PowerShell 5.1 needs the NuGet provider bootstrapped non-interactively.
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Unit + Static + Guard tiers
        shell: ${{ matrix.engine }}
        env:
          # Skip the AD: drive auto-mount on module import - there is no domain to mount from.
          ADPS_LoadDefaultDrive: '0'
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path ./Tests/Sync-ADCSTemplate.Tests.ps1 -ExcludeTag Lab -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }
