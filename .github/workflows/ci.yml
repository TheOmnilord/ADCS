name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table Severity, RuleName, ScriptName, Line -AutoSize | Out-String -Width 200 | Write-Host
            throw "$(@($results).Count) PSScriptAnalyzer finding(s) - see above."
          }
          Write-Host 'PSScriptAnalyzer: clean.'

  test:
    name: Pester (5.1 + 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The Guard tiers invoke each script, which imports its module up front (ActiveDirectory
      # for Sync-ADCSTemplate; GroupPolicy for Add-CertificateEnrollmentPolicyServerToGpo). Their
      # validation throws fire BEFORE any DC/GPO is contacted, so the modules are required but no
      # domain/DC is - the RSAT/GPMC features on the Server-based runner supply both. (GPMC brings
      # the GroupPolicy module; without it the GPO Guard tier self-skips rather than failing.)
      - name: Install RSAT ActiveDirectory module and GPMC (GroupPolicy module)
        shell: pwsh
        run: Install-WindowsFeature RSAT-AD-PowerShell, GPMC | Out-Null

      # The two engines keep separate CurrentUser module paths, so Pester 5+ is installed per
      # engine. Encoding/typing semantics differ between 5.1 and 7 - the safe tiers run under
      # each. ADPS_LoadDefaultDrive=0 skips the AD: drive mount (there is no domain to mount).
      - name: Run Unit + Static + Guard tiers (Windows PowerShell 5.1)
        shell: powershell
        env:
          ADPS_LoadDefaultDrive: '0'
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path ./Tests -ExcludeTag Lab -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }

      - name: Run Unit + Static + Guard tiers (PowerShell 7)
        # Run even if the 5.1 leg failed, so one red engine does not hide the other's result.
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          ADPS_LoadDefaultDrive: '0'
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path ./Tests -ExcludeTag Lab -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }
