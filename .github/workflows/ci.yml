name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      # Pinned to the commit behind v5: a mutable tag can be moved to arbitrary code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        # Exact version, so a new gallery release cannot change what runs (or what passes) here.
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table Severity, RuleName, ScriptName, Line -AutoSize | Out-String -Width 200 | Write-Host
            throw "$(@($results).Count) PSScriptAnalyzer finding(s) - see above."
          }
          Write-Host 'PSScriptAnalyzer: clean.'

  test:
    name: Pester (5.1 + 7)
    runs-on: windows-latest
    steps:
      # Pinned to the commit behind v5: a mutable tag can be moved to arbitrary code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The Guard tiers invoke each script, which imports its module up front (ActiveDirectory
      # for Sync-ADCSTemplate; GroupPolicy for Add-CertificateEnrollmentPolicyServerToGpo). Their
      # validation throws fire BEFORE any DC/GPO is contacted, so the modules are required but no
      # domain/DC is - the RSAT/GPMC features on the Server-based runner supply both. (GPMC brings
      # the GroupPolicy module.) A Guard context whose module is missing SKIPS itself, so the
      # feature result is checked here, both modules are imported in each engine before the run,
      # and any skipped test fails the leg - missing coverage must never pass quietly.
      - name: Install RSAT ActiveDirectory module and GPMC (GroupPolicy module)
        shell: pwsh
        run: |
          $r = Install-WindowsFeature RSAT-AD-PowerShell, GPMC
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if (-not $r.Success) { throw "Feature installation did not succeed - the Guard tiers would self-skip." }

      # The two engines keep separate CurrentUser module paths, so Pester is installed per
      # engine, at an EXACT version (a floating minimum would let a new gallery release change
      # what runs here). -SkipPublisherCheck is required because Windows ships Pester 3.4 inbox
      # under a different publisher certificate, and Install-Module refuses the upgrade without
      # it; the version pin is what keeps the install reproducible. Encoding/typing semantics
      # differ between 5.1 and 7 - the safe tiers run under each. ADPS_LoadDefaultDrive=0 skips
      # the AD: drive mount (there is no domain to mount).
      - name: Run Unit + Static + Guard tiers (Windows PowerShell 5.1)
        shell: powershell
        env:
          ADPS_LoadDefaultDrive: '0'
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 6.1.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 6.1.0
          # Both Guard-tier modules must be present in THIS engine; a Guard context self-skips otherwise.
          Import-Module ActiveDirectory, GroupPolicy -ErrorAction Stop
          $result = Invoke-Pester -Path ./Tests -ExcludeTag Lab -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }
          # With Lab excluded by tag (NotRun, not Skipped), nothing in the Unit/Static/Guard tiers may
          # skip: a skipped test here means a Guard context lost its module and covered nothing.
          if ($result.SkippedCount -gt 0) { throw "$($result.SkippedCount) test(s) were skipped - required coverage is missing." }
          # FailedCount only counts failed It blocks. A discovery error, a container that fails
          # to load, or a BeforeAll/AfterAll throw fails the RUN without any failed test, so the
          # overall result is checked as well - the step must not go green on those.
          if ($result.Result -ne 'Passed') { throw "Pester run result is '$($result.Result)' (failed containers: $($result.FailedContainersCount), failed blocks: $($result.FailedBlocksCount))." }

      - name: Run Unit + Static + Guard tiers (PowerShell 7)
        # Run even if the 5.1 leg failed, so one red engine does not hide the other's result.
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          ADPS_LoadDefaultDrive: '0'
        run: |
          Install-Module Pester -RequiredVersion 6.1.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 6.1.0
          # Both Guard-tier modules must be present in THIS engine; a Guard context self-skips otherwise.
          Import-Module ActiveDirectory, GroupPolicy -ErrorAction Stop
          $result = Invoke-Pester -Path ./Tests -ExcludeTag Lab -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }
          # With Lab excluded by tag (NotRun, not Skipped), nothing in the Unit/Static/Guard tiers may
          # skip: a skipped test here means a Guard context lost its module and covered nothing.
          if ($result.SkippedCount -gt 0) { throw "$($result.SkippedCount) test(s) were skipped - required coverage is missing." }
          # FailedCount only counts failed It blocks. A discovery error, a container that fails
          # to load, or a BeforeAll/AfterAll throw fails the RUN without any failed test, so the
          # overall result is checked as well - the step must not go green on those.
          if ($result.Result -ne 'Passed') { throw "Pester run result is '$($result.Result)' (failed containers: $($result.FailedContainersCount), failed blocks: $($result.FailedBlocksCount))." }
